<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>READY — IRONTRAIL integration validation</title><style>html,body{height:100%;margin:0;overflow:hidden;background:#10241d;color:#e1e8cc;font:12px monospace}header{height:70px;display:flex;align-items:center;gap:20px;padding:8px 16px;box-sizing:border-box}button{background:#e4b76a;color:#233524;border:0;border-radius:5px;font-weight:bold;padding:11px 17px;cursor:pointer}button:disabled{opacity:.4}#fixture{display:block;border:0;width:100%;height:calc(100% - 190px)}#result{height:120px;margin:0;padding:10px 16px;overflow:auto;box-sizing:border-box;white-space:pre-wrap;background:#0b211b}#status{max-width:70%;line-height:1.5}</style></head><body><header><button id="start" disabled>Loading fixture…</button><span id="status">Real bundled HTML in an isolated iframe. Production campaign and ghost storage stay untouched.</span></header><iframe id="fixture" title="Isolated real IRONTRAIL game"></iframe><pre id="result">Loading the current index.html…</pre><script>
'use strict';
const frame=document.getElementById('fixture'),button=document.getElementById('start'),output=document.getElementById('result'),status=document.getElementById('status');
const params=new URLSearchParams(location.search),requestedDpr=params.has('dpr')&&Number(params.get('dpr'))>=.5&&Number(params.get('dpr'))<=3?Number(params.get('dpr')):null,phase=params.get('phase')||'all',runId='integration-'+Date.now().toString(36),campaignKey='irontrail-campaign-qa-'+runId,ghostPrefix='irontrail-ghost-qa-'+runId+'-';
const lines=[],metrics=[];let win,doc,game,running=false,current='Ready',reportTimer;
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(value,message)=>{if(!value)throw Error(message);};
function log(text){lines.push(text);output.textContent=lines.join('\n');output.scrollTop=output.scrollHeight;}
function key(code,down=true){const names={KeyW:'w',KeyX:'x',KeyP:'p',KeyZ:'z',Escape:'Escape'};win.dispatchEvent(new win.KeyboardEvent(down?'keydown':'keyup',{code,key:names[code]||code,bubbles:true,cancelable:true}));}
function click(selector){const node=doc.querySelector(selector);assert(node&&!node.disabled,'Missing/disabled control '+selector);node.click();}
async function waitFor(test,timeout=5000,label='condition'){const stop=performance.now()+timeout;while(performance.now()<stop){if(test())return;await delay(20);}throw Error('Timeout '+label+'; mode='+game.mode+', time='+game.telemetry.time.toFixed(2));}
function setButton(index,value){const b=win.__qaPad.buttons[index];b.value=value;b.pressed=value>.5;}
async function edgeButton(index){setButton(index,1);await delay(70);setButton(index,0);await delay(70);}
function resetPad(){win.__qaPad.connected=false;for(let i=0;i<17;i++)setButton(i,0);win.__qaPad.axes[0]=0;win.__qaPad.axes[1]=0;}
function perfStart(label){win.__qaTiming.reset();current=label;}
function perfEnd(label){const data=win.__qaTiming.summary();metrics.push({label,...data});log('PERF '+label+': viewport '+data.viewport.width+'×'+data.viewport.height+' CSS px; browser/display DPR '+data.browserDpr+', app DPR '+data.appDpr+(data.dprOverride===null?' (native)':' (QA override '+data.dprOverride+')')+'; canvas '+data.canvas.width+'×'+data.canvas.height+' backing px; renderScale '+data.renderScale+' (max '+data.maxRenderScale+').');log('PERF '+label+': first playing callback '+data.firstPlayingMs+' ms; '+data.frames+' warmed frames, callback mean '+data.meanMs+' ms, p99 '+data.p99Ms+' ms, max '+data.maxMs+' ms; '+data.observedHz+' Hz; max '+data.maxDrawOps+' draws.');}
async function drive(stage,{shoot=true,pad=false,label='stage '+(stage+1)}={}){
  current='Driving '+label;resetPad();game.qa.start(stage);await waitFor(()=>game.mode==='playing',3000,'start');perfStart(label);
  if(pad){win.__qaPad.connected=true;setButton(7,1);}else key('KeyW');
  let fired=false,sawSlow=false,sawImpact=false;const stop=performance.now()+65000;
  while(game.mode==='playing'&&performance.now()<stop){
    const t=game.telemetry;if(game.encounter.timeScale<.5)sawSlow=true;if(game.encounter.phase==='impact')sawImpact=true;
    if(shoot&&!fired&&t.weapon.canHit&&t.ammo){if(pad){setButton(0,1);await delay(60);setButton(0,0);}else{key('KeyX');key('KeyX',false);}fired=true;}
    await delay(12);
  }
  key('KeyW',false);resetPad();perfEnd(label);
  assert(game.mode!=='playing','Driving timed out '+label);if(shoot){assert(fired,'Never obtained target lock '+label);assert(sawSlow&&sawImpact,'Slow motion and impact must be visible '+label);}
  return {mode:game.mode,failed:game.physics.failed,time:game.telemetry.time,fuel:game.telemetry.fuel,gap:game.telemetry.rival?game.telemetry.x-game.telemetry.rival.x:null};
}
async function runFlow(){
  const initialRuns=game.campaign.totals.runs;click('[data-ui="dedication"]');assert(game.mode==='dedication'&&doc.getElementById('screenHeading').textContent.includes('Ojas'),'Dedication opens');click('#playButton');assert(game.mode==='title'&&game.campaign.totals.runs===initialRuns,'Dedication returns without starting a run');log('PASS Ojas dedication opens and returns without changing progress.');
  const before=game.campaign,scrapBefore=before.scrap,runsBefore=before.totals.runs;
  const result=await drive(0,{label:'stage 1 clear'});assert(result.mode==='cleared','Stage 1 failed '+result.failed);assert(game.telemetry.ammo===0&&!game.telemetry.monster.alive,'One shot must clear monster');
  let campaign=game.campaign;assert(campaign.completed.includes(0)&&campaign.totals.runs===runsBefore+1&&campaign.scrap>scrapBefore,'Clear reward/progress');
  const ghost=JSON.parse(win.localStorage.getItem(ghostPrefix+0)||'null');assert(ghost?.hz===20&&ghost.data.length>90,'Best-run ghost stored');
  const rewardScrap=campaign.scrap,rewardRuns=campaign.totals.runs;click('[data-ui="garage"]');assert(game.mode==='garage','Garage from results');click('#playButton');assert(game.mode==='cleared','Back to results');assert(game.campaign.scrap===rewardScrap&&game.campaign.totals.runs===rewardRuns,'Results back must not duplicate rewards');
  log('PASS stage 1 '+result.time.toFixed(2)+'s; one shot, results, progress, scrap, stored 20 Hz ghost and idempotent return.');
  const audio=game.audio;assert(audio.context?.state==='running'&&audio.music?.stats.notes>80&&audio.music.stats.drums>20,'Live music scheduler did not advance');assert(audio._voices.size<=96&&audio.music._drums.size<=32,'Live audio source limit');log('PASS live audio: '+audio.music.stats.notes+' notes, '+audio.music.stats.drums+' drum hits; bounded voices; original theme '+audio.music.constructor.THEME+'.');
  click('#playButton');assert(game.mode==='brief'&&game.stage===2,'Next stage brief');const oldPhysics=game.physics,oldLevel=game.physics.tuning.engine;click('[data-ui="garage"]');click('[data-ui="buy"][data-track="engine"]');assert(game.campaign.upgrades.engine===oldLevel+1,'Garage purchase');assert(!doc.getElementById('hudCue').hidden,'Purchase icon visible');click('#playButton');assert(game.mode==='brief','Back to brief');click('#playButton');assert(game.mode==='countdown','Brief starts countdown');assert(!doc.getElementById('gameHud').contains(doc.getElementById('hudBanner')),'Countdown independent of hidden HUD');await waitFor(()=>game.mode==='playing',4500,'countdown');assert(game.physics!==oldPhysics&&game.physics.tuning.engine===oldLevel+1,'Garage tuning applies to next run');
  await delay(250);key('KeyP');key('KeyP',false);assert(game.mode==='paused','Keyboard pause');const paused={time:game.telemetry.time,fuel:game.telemetry.fuel};await delay(550);assert(game.telemetry.time===paused.time&&game.telemetry.fuel===paused.fuel,'Pause freezes time/fuel');const cent=Math.floor(paused.time*100+1e-6),shownTime=String(Math.floor(cent/6000)).padStart(2,'0')+':'+String(Math.floor(cent/100)%60).padStart(2,'0')+'.'+String(cent%100).padStart(2,'0');assert(doc.getElementById('screenHeading').textContent.includes(shownTime),'Pause preserves accessible run time');
  click('[data-ui="settings"]');const slider=doc.getElementById('setting-music');slider.value=23;slider.dispatchEvent(new win.Event('input',{bubbles:true}));assert(game.campaign.settings.music===.23,'Settings change');assert(JSON.parse(win.localStorage.getItem(campaignKey)).settings.music===.23,'Settings persisted');click('#playButton');assert(game.mode==='paused','Settings returns pause');click('#playButton');assert(game.mode==='playing','Resume');
  log('PASS next-stage brief → garage upgrade → countdown applies tuning; pause freezes world; settings persist and resume.');
  game.qa.start(0);await delay(70);assert(!doc.getElementById('hudGhost').hidden,'Best ghost replay visible');log('PASS stored best-run ghost replay.');
}
async function runFailures(){
  const miss=await drive(0,{shoot:false,label:'unshot monster failure'});assert(miss.mode==='failed'&&miss.failed==='monster','Mandatory monster collision must fail');assert(game.telemetry.ammo===1,'No shot retains unused charge');log('PASS unshot mandatory monster fails at '+miss.time.toFixed(2)+'s.');
  click('#playButton');await waitFor(()=>game.mode==='playing',4500,'monster retry');assert(game.telemetry.ammo===1&&game.telemetry.monster.alive&&game.telemetry.fuel>98,'Retry restores attempt resources');
  game.qa.start(0);game.physics.fuel=.001;await waitFor(()=>game.mode==='failed',2500,'fuel failure');assert(game.physics.failed==='fuel','Empty fuel failure');click('#playButton');await waitFor(()=>game.mode==='playing',4500,'fuel retry');assert(game.telemetry.fuel>98&&game.telemetry.ammo===1,'Fuel retry refills/reloads');log('PASS fuel failure and both retry paths restore full attempt.');
}
async function runBoss(){const result=await drive(9,{label:'boss actual physics'});assert(result.mode==='victory'&&game.physics.finished,'Clean boss race must win '+JSON.stringify(result));assert(game.physics.rival?.chassis&&game.physics.rival.wheels.length===2,'Rival has physical chassis and wheels');assert(game.campaign.completed.includes(9),'Boss completion saved');log('PASS Iron Maw race '+result.time.toFixed(2)+'s, player lead '+result.gap.toFixed(2)+'m; campaign victory.');}
async function runPad(){
  resetPad();game.qa.start(0);perfStart('gamepad stage 1');win.__qaPad.connected=true;setButton(7,1);await delay(650);assert(game.telemetry.x>game.physics.track.startX+.1,'Gamepad RT drives');assert(doc.querySelector('#fireButton .keycap').textContent==='A'&&doc.querySelector('#recoverButton .keycap').textContent==='X'&&doc.getElementById('nitroHint').textContent==='RB','Actual gamepad updates gameplay hints');await edgeButton(9);assert(game.mode==='paused','Gamepad Start pauses');const t=game.telemetry.time,f=game.telemetry.fuel;await delay(300);assert(game.telemetry.time===t&&game.telemetry.fuel===f,'Gamepad pause freezes');await edgeButton(9);assert(game.mode==='playing','Gamepad Start resumes');
  setButton(7,1);let fired=false,sawSlow=false,sawImpact=false;const stop=performance.now()+30000;while(game.mode==='playing'&&performance.now()<stop){if(!fired&&game.telemetry.weapon.canHit){await edgeButton(0);fired=true;}await delay(12);}resetPad();perfEnd('gamepad stage 1');assert(game.mode==='cleared'&&fired&&game.telemetry.ammo===0,'Gamepad A fires one shot and clears');log('PASS synthetic gamepad RT, Start pause/resume and A cannon complete stage 1.');
}
// Redline: nitro through the real keyboard path, HUD/award feedback, the coasting finish outro and results awards.
async function runRedline(){
  current='Redline nitro run';resetPad();game.qa.start(0);await waitFor(()=>game.mode==='playing',3000,'start');
  assert(game.telemetry.nitro===win.TruckPhysics.NITRO.start&&doc.getElementById('nitroHud'),'Nitro meter starts at the published level');await waitFor(()=>doc.getElementById('nitroHint').textContent==='Z',1500,'keyboard nitro hint after the pad disconnects');
  key('KeyW');key('KeyZ');let fired=false,sawBurn=false,sawHud=false,sawAward=false,sawOutro=false,sawBars=false,outroTime=null,top=0;const stop=performance.now()+40000;
  while(game.mode==='playing'&&performance.now()<stop){
    const t=game.telemetry;top=Math.max(top,t.speed);if(t.boosting)sawBurn=true;if(doc.getElementById('nitroHud').classList.contains('burning'))sawHud=true;
    if(doc.querySelector('#hudAwards .award-slab.show'))sawAward=true;
    if(game.outro){sawOutro=true;if(outroTime===null)outroTime=t.time;assert(t.time===outroTime,'Run clock stops at the finish');if(game.cinema.bars>.5&&game.cinema.timeScale<1)sawBars=true;}
    if(!fired&&t.weapon.canHit&&t.ammo){key('KeyX');key('KeyX',false);fired=true;}
    await delay(12);
  }
  key('KeyW',false);key('KeyZ',false);
  assert(game.mode==='cleared','Boosted stage 1 must clear: '+game.mode+' '+game.physics.failed);const t=game.telemetry;
  assert(sawBurn&&t.stats.nitroBurned>20&&sawHud,'Z burns nitro and the HUD shows it');assert(sawAward,'Kinetic award slabs appear');
  assert(sawOutro&&sawBars,'Finish outro coasts in slow motion with letterbox');assert(t.time<11.6&&top>25.5,'Nitro is faster: '+t.time.toFixed(2)+'s top '+top.toFixed(1));
  assert(t.stats.smashes>0&&doc.querySelectorAll('.result-award').length>=3,'Results list awards');assert(/Nitro burn/.test(doc.querySelector('.score-breakdown').textContent),'Nitro burn bonus row');
  assert(game.campaign.totals.smashes>=t.stats.smashes,'Smash totals persist');
  log('PASS Redline: Z nitro '+t.time.toFixed(2)+'s (top '+(top*3.6).toFixed(0)+' km/h, '+Math.round(t.stats.nitroBurned)+' burned, '+t.stats.smashes+' smashes), HUD/awards, slow-motion finish outro, results awards.');
  game.qa.start(9);await waitFor(()=>game.mode==='playing',3000,'boss');key('KeyW');await delay(1500);assert(!game.telemetry.escalated&&!game.telemetry.rival.boosting,'Iron Maw waits for the player');
  key('KeyZ');await waitFor(()=>game.telemetry.escalated,3000,'escalation');key('KeyZ',false);await waitFor(()=>game.telemetry.rival.boosting,9000,'rival burn');key('KeyW',false);
  assert(doc.getElementById('hudGap').hidden===false,'Boss gap badge');log('PASS Iron Maw answers the first burn with its own nitro; gap badge visible.');
  // A fresh attempt must teach nitro again even after the player burned it in a previous race.
  game.qa.start(0);game.physics.grantNitro(60);await waitFor(()=>doc.querySelector('#hudAwards .award-nitro.show'),3000,'nitro-ready cue after retry');
  log('PASS fresh attempt restores the nitro-ready tutorial after a prior burn.');
}
// Live objective wiring follows real recovery/fuel state and starts clean on the next route.
async function runGoals(){
  current='Live star goals';resetPad();game.qa.start(2);
  await waitFor(()=>doc.getElementById('hudGoal').classList.contains('on'),1500,'no-recovery goal');
  assert(doc.getElementById('hudGoalGlyph').getAttribute('href')==='#ic-norecover','Stage-specific objective pictogram');
  const fuel=game.telemetry.fuel;key('KeyC');key('KeyC',false);
  await waitFor(()=>!doc.getElementById('hudGoal').classList.contains('on'),1500,'recovery invalidates challenge');
  assert(game.telemetry.recoveries===1&&game.telemetry.fuel<=fuel-12,'Recovery costs fuel and changes actual run summary');
  game.qa.start(3);await waitFor(()=>doc.getElementById('hudGoal').classList.contains('on')&&doc.getElementById('hudGoalGlyph').getAttribute('href')==='#ic-can',1500,'fresh fuel goal');
  game.physics.fuel=59;await waitFor(()=>!doc.getElementById('hudGoal').classList.contains('on'),1500,'fuel goal lost');
  game.qa.start(0);await waitFor(()=>doc.getElementById('hudGoalGlyph').getAttribute('href')==='#ic-zombie',1500,'next route goal reset');
  assert(!doc.getElementById('hudGoal').classList.contains('on')&&!doc.getElementById('hudClock').classList.contains('lost'),'Fresh attempt clears challenge and restores clock star');
  await waitFor(()=>doc.getElementById('app').classList.contains('nudge-gas')&&doc.querySelector('#hudCue.cue-drive'),5000,'idle driver gets the gas picture prompt');
  // Stay still through par to check the real simulation clock, with no encounter or timer override.
  await waitFor(()=>doc.getElementById('hudClock').classList.contains('lost'),19000,'par time expires');
  assert(game.telemetry.time>win.IronRules.PAR_TIMES[0]&&game.mode==='playing','Clock goal expires during active driving');
  log('PASS live stars: recovery/fuel invalidate goals, route/retry reset the pictograms, real par time expires.');
}
async function run(){
  if(running)return;running=true;button.disabled=true;document.title='RUNNING — IRONTRAIL integration validation';lines.length=0;log('RUN '+phase+' · isolated QA campaign '+campaignKey);frame.contentWindow.focus();game.audio.prime();reportTimer=setInterval(()=>{const t=game.telemetry;status.textContent=current+' · '+game.mode+' · '+t.time.toFixed(2)+'s · fuel '+Math.ceil(t.fuel)+'% · ammo '+t.ammo;},500);
  try{await waitFor(()=>game.qa.warm,4000,'warm-up');if(phase==='all'||phase==='flow')await runFlow();if(phase==='all'||phase==='failures')await runFailures();if(phase==='all'||phase==='boss')await runBoss();if(phase==='all'||phase==='gamepad')await runPad();if(phase==='all'||phase==='redline')await runRedline();if(phase==='all'||phase==='goals')await runGoals();assert(['all','flow','failures','boss','gamepad','redline','goals'].includes(phase),'Unknown phase '+phase);key('KeyW',false);resetPad();if(game.mode==='playing'){key('KeyP');key('KeyP',false);}log('PASS integration '+phase+'; production storage untouched.');document.title='PASS — IRONTRAIL integration validation';status.textContent='PASS · '+phase+' · see exact checks and callback metrics below.';globalThis.irontrailIntegration={phase,lines:lines.slice(),metrics,campaignKey,ghostPrefix};}
  catch(error){log('FAIL '+error.stack);document.title='FAIL — IRONTRAIL integration validation';status.textContent='FAIL · '+current;key('KeyW',false);resetPad();}
  finally{clearInterval(reportTimer);running=false;button.textContent='Reload for another run';button.disabled=false;button.onclick=()=>location.reload();}
}

    const seed={version:3,unlocked:10,selected:0,completed:[],best:{},stars:{},bestScore:{},scrap:600,upgrades:{engine:0,tyres:0,suspension:0,tank:0},settings:{quality:'high',master:.9,music:.55,sfx:.9,shake:true,showFps:false,reducedMotion:false}};

his.requestAnimationFrame=fn=>raf(function(now){const isGame=fn.name==='animation',begin=isGame?performance.now():0;fn(now);const end=isGame?performance.now():0,g=globalThis.irontrail;if(isGame&&g&&g.mode==='playing'&&firstPlayingMs===null)firstPlayingMs=end-begin;if(isGame&&g&&g.mode==='playing'&&g.telemetry.time>1&&count<10000){data[count*2]=now;data[count*2+1]=end-begin;count++;if(g.perf.drawOps>maxDrawOps)maxDrawOps=g.perf.drawOps;if(g.perf.renderScale>maxScale)maxScale=g.perf.renderScale;}});})();`;
