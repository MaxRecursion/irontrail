<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>IRONTRAIL audio validation</title>
<style>body{background:#19221b;color:#d6efb1;font:16px monospace;padding:30px}pre{white-space:pre-wrap}</style>
<h1>Audio signal validation</h1>
<pre id="result">Rendering…</pre>
<script src="../src/music.js?v=5"></script>
<script src="../src/audio.js?v=6"></script>
<script>
(async () => {
  const result = document.getElementById('result');
  const reports = {}, passes = [];
  const assert = (condition, message) => { if (!condition) throw Error(message); };
  const eventCalls = [
    ['slowEntry',a=>a.slowMotion(.25)], ['slowExit',a=>{a._slow=true;a.slowMotion(1);}], ['takeoff',a=>a.takeoff(1)], ['landing',a=>a.landing(1)],
    ['flip',a=>a.flip(1)], ['perfect',a=>a.perfect()], ['combo',a=>a.combo(3)], ['scoreTick',a=>a.scoreTick()], ['star',a=>a.star(1)], ['checkpoint',a=>a.checkpoint()], ['lowFuel',a=>a.lowFuel()], ['countdown',a=>a.countdown(3)], ['go',a=>a.go()], ['uiMove',a=>a.ui('move')], ['uiBuy',a=>a.ui('buy')], ['celebrate',a=>a.celebrate()],
    ['pickup', audio => audio.pickup()],
    ['zombieHit', audio => audio.zombieHit(1)],
    ['collision', audio => audio.collision(1)],
    ['gunshot', audio => audio.gunshot()],
    ['monsterHit', audio => audio.monsterHit()],
    ['monsterCrash', audio => audio.monsterCrash()],
    ['resultWin', audio => audio.result(true)],
    ['resultLose', audio => audio.result(false)]
  ];
  function stats(samples, fromSeconds = 0) {
    let peak = 0, squares = 0, invalid = 0;
    const start = Math.floor(fromSeconds * 48000);
    for (let i = start; i < samples.length; i++) {
      const sample = samples[i];
      if (!Number.isFinite(sample)) invalid++;
      peak = Math.max(peak, Math.abs(sample));
      squares += sample * sample;
    }
    return { peak, rms: Math.sqrt(squares / Math.max(1, samples.length - start)), invalid };
  }
  function finiteAndComfortable(signal, name, audible = true) {
    assert(!signal.invalid && Number.isFinite(signal.peak) && Number.isFinite(signal.rms), name + ': non-finite samples');
    assert(signal.peak < 0.95, name + ': clipping or excessive output ' + JSON.stringify(signal));
    if (audible) assert(signal.rms > 0.0002 && signal.peak > 0.003, name + ': inaudible ' + JSON.stringify(signal));
  }
  // Offline contexts are suspended until rendering. This narrow test adapter
  // permits event scheduling before rendering while retaining real public
  // pause/mute guards; production still requires a running browser context.
  class OfflineTruckAudio extends TruckAudio {
    _canPlay() { return this._ready && !this.paused && !this.muted; }
  }
  function createAudio({ muted = false, paused = false, effectsOnly = false } = {}) {
    const audio = new OfflineTruckAudio();
    audio.context = new OfflineAudioContext(1, 48000, 48000);
    audio._buildGraph();
    audio.setMuted(muted);
    audio.setPaused(paused);
    if (effectsOnly) {
      // Isolate event energy from the persistent engine and ambience graph.
      for (const gain of [audio.engineGain, audio.subGain, audio.intakeGain, audio.gravel.gain, audio.wind.gain, audio.exhaustNoise.gain,audio.skid.gain,audio.creak.gain]) gain.gain.value = 0;
    }
    return audio;
  }
  async function render(audio) {
    const buffer = await audio.context.startRendering();
    return buffer.getChannelData(0);
  }
  try {
    const locked = new TruckAudio();
    locked.update({ speed: 0, wheelSpeed: 0, throttle: 0, grounded: true }, 0.016);
    locked.takeoff(1); locked.landing(1);
    for (const [, call] of eventCalls) call(locked);
    locked.setPaused(true); locked.setMuted(true);
    assert(locked._voices.size === 0 && locked.context === null, 'Pre-unlock events created audio resources');
    passes.push('PASS · Driving, campaign, shotgun, and monster APIs are safe before unlock.');

    const engine = createAudio();
    engine.update({ speed: 18, wheelSpeed: 25, throttle: 1, grounded: true, airtime: 0 }, 1 / 60);
    reports.engine = stats(await render(engine));
    finiteAndComfortable(reports.engine, 'Engine');
    passes.push('PASS · Engine signal is finite, audible, and below clipping.');

    const allEffects = createAudio({ effectsOnly: true });
    for (const [name, call] of eventCalls) {
      const audio = createAudio({ effectsOnly: true });
      call(audio);
      const voiceCount = audio._voices.size;
      assert(voiceCount > 0, name + ': no event voice created');
      call(audio);
      assert(audio._voices.size === voiceCount, name + ': repeated same-frame callback escaped cooldown');
      reports[name] = stats(await render(audio));
      finiteAndComfortable(reports[name], name);
      call(allEffects);
    }
    reports.combined = stats(await render(allEffects));
    finiteAndComfortable(reports.combined, 'Combined gameplay effects');
    passes.push('PASS · Fuel, zombie, collision, shotgun, monster-hit/crash, win, and loss cues are audible; stacked effects stay finite and below clipping.');
    passes.push('PASS · Same-frame repeated event callbacks are suppressed.');

    for (const flag of ['muted', 'paused']) {
      const audio = createAudio({ [flag]: true });
      audio.update({ speed: 24, wheelSpeed: 32, throttle: 1, grounded: false, airtime: 1 }, 1 / 30);
      audio.takeoff(1); audio.landing(1);
      for (const [, call] of eventCalls) call(audio);
      assert(audio._voices.size === 0, flag + ': event scheduling was not suppressed');
      reports[flag] = stats(await render(audio));
      assert(reports[flag].invalid === 0 && reports[flag].peak < 0.00001, flag + ': signal leaked ' + JSON.stringify(reports[flag]));
    }
    passes.push('PASS · Mute and pause suppress both engine output and all event scheduling.');

    const interrupted = createAudio({ effectsOnly: true });
    interrupted.result(true); interrupted.pickup(); interrupted.collision(1);
    interrupted.gunshot(); interrupted.monsterHit(); interrupted.monsterCrash();
    assert(interrupted._voices.size > 0, 'Interruption test did not schedule voices');
    interrupted.setPaused(true);
    interrupted.zombieHit(1); interrupted.gunshot(); interrupted.monsterHit(); interrupted.monsterCrash();
    // Resume immediately: previously scheduled tones must still end at the
    // pause cutoff, rather than resurfacing when the master gate reopens.
    interrupted.setPaused(false);
    const interruptedSamples = await render(interrupted);
    reports.afterPauseResume = stats(interruptedSamples, 0.08);
    assert(reports.afterPauseResume.invalid === 0 && reports.afterPauseResume.peak < 0.00001,
      'Paused event tail resurfaced on resume: ' + JSON.stringify(reports.afterPauseResume));
    passes.push('PASS · Pause cancels pending result/impact voices; resuming cannot replay their tails.');

    for(const mood of TruckMusic.MOODS){
      const c=new OfflineAudioContext(1,96000,48000),music=new TruckMusic(c,c.destination);
      music.scheduleOffline(2,{biome:4,intensity:.8,mood,playing:true});
      reports['music-'+mood]=stats((await c.startRendering()).getChannelData(0));
      finiteAndComfortable(reports['music-'+mood],'Music '+mood);music.dispose();
    }
    passes.push('PASS · Persistent-voice music renders finite audible output in every mood.');
    const longContext=new OfflineAudioContext(1,19*48000,48000),theme=new TruckMusic(longContext,longContext.destination);
    theme.scheduleOffline(19,{biome:0,intensity:1,mood:'drive',playing:true});
    reports.fullTheme=stats((await longContext.startRendering()).getChannelData(0));
    finiteAndComfortable(reports.fullTheme,'Eight-bar theme');assert(theme.step>128&&theme.stats.drums>100,'Full call/answer arrangement or drum progression missing');theme.dispose();
    async function musicAtVolume(volume){const c=new OfflineAudioContext(1,96000,48000),m=new TruckMusic(c,c.destination);m.setVolume(volume);m.scheduleOffline(2,{mood:'drive',playing:true,intensity:1});const signal=stats((await c.startRendering()).getChannelData(0));m.dispose();return signal;}
    const fullMusic=await musicAtVolume(1),halfMusic=await musicAtVolume(.5);
    assert(Math.abs(halfMusic.rms/fullMusic.rms-.5)<.005,'Music volume is not proportional');
    passes.push('PASS · Complete eight-bar call/answer theme and proportional music volume.');
    const fullMix=createAudio();fullMix.music.scheduleOffline(1,{mood:'boss',biome:9,playing:true,intensity:1});
    fullMix.landing(1);fullMix.gunshot();fullMix.monsterHit();fullMix.collision(1);
    reports.fullMix=stats(await render(fullMix));finiteAndComfortable(reports.fullMix,'Music + V8 + heavy impacts');
    passes.push('PASS · Theme, V8 and simultaneous cannon/landing/collision/monster layers stay below clipping.');
    // Air wind must respond to flight, not merely forward wheel speed.
    class MotionAudio extends OfflineTruckAudio{_set(param,value,smoothing=.055){param.setTargetAtTime(value,this.context.currentTime,smoothing);}}
    async function airSignal(airborne){const a=new MotionAudio();a.context=new OfflineAudioContext(1,48000,48000);a._buildGraph();a.setPaused(false);a.setMusicState({mood:'drive',playing:false});a.update({speed:20,wheelSpeed:27,grounded:!airborne,airtime:airborne?1:0,vy:airborne?-12:0},1/60,{throttle:0,timeScale:1});for(const gain of [a.engineGain,a.subGain,a.intakeGain,a.gravel.gain,a.exhaustNoise.gain,a.skid.gain,a.creak.gain]){gain.gain.cancelScheduledValues(0);gain.gain.value=0;}return stats(await render(a));}
    reports.groundWind=await airSignal(false);reports.airWind=await airSignal(true);
    assert(reports.airWind.rms>reports.groundWind.rms*3,'Air-time wind does not open up in flight');finiteAndComfortable(reports.airWind,'Air-time wind');
    const stereo=new OfflineTruckAudio();stereo.context=new OfflineAudioContext(2,48000,48000);stereo._buildGraph();stereo.setPaused(false);stereo.engineGain.gain.value=0;stereo.subGain.gain.value=0;stereo.setScene({x:0},{x:15});stereo.monsterHit();
    const stereoBuffer=await stereo.context.startRendering();reports.stereoLeft=stats(stereoBuffer.getChannelData(0));reports.stereoRight=stats(stereoBuffer.getChannelData(1));
    assert(reports.stereoRight.rms>reports.stereoLeft.rms*1.6,'Monster impact is not spatially directed');
    const bounded=createAudio({effectsOnly:true});for(let i=0;i<500;i++)bounded._noiseSweep(.01,300,1500,.1);assert(bounded._voices.size===96,'Effect voice limit is not bounded');await render(bounded);assert(bounded._voices.size===0,'Effect nodes were not released after playback');
    passes.push('PASS · Flight wind rises, monster impacts pan toward the target, and all event voices are capped/released.');

    const mutedMusicContext=new OfflineAudioContext(1,48000,48000),mutedMusic=new TruckMusic(mutedMusicContext,mutedMusicContext.destination);
    mutedMusic.setVolume(0);mutedMusic.scheduleOffline(1,{mood:'boss',playing:true,intensity:1});
    const musicZero=stats((await mutedMusicContext.startRendering()).getChannelData(0));assert(musicZero.peak===0,'Music volume0 is not silent');mutedMusic.dispose();
    const zeroMaster=createAudio();zeroMaster.setVolumes({master:0});zeroMaster.gunshot();assert(stats(await render(zeroMaster)).peak===0,'Master volume0 leaks');
    passes.push('PASS · Zero music/master volumes produce silence.');
    // A mock suspended AudioParam makes accidental scheduling an immediate test
    // failure, and demonstrates bounded targets after 20,000 render updates.
    const suspended=new TruckAudio();let scheduled=0;
    suspended.context={state:'suspended',currentTime:12};
    const param={setTargetAtTime(){scheduled++;},cancelScheduledValues(){}};
    for(let i=0;i<20000;i++)suspended._set(param,i%113,.05);
    assert(scheduled===0&&suspended._targets.size===1,'Suspended context queued automation');
    suspended.context.state='running';suspended._flushTargets();assert(scheduled===1,'Targets were not flushed exactly once onresume');
    passes.push('PASS · Suspended context queues no automation and keeps bounded targets.');
    result.textContent = passes.join('\n') + '\n\n' + JSON.stringify(reports, null, 2);
    document.title = 'PASS — IRONTRAIL audio validation';
  } catch (error) {
    result.textContent = passes.join('\n') + '\nFAIL · ' + error.stack + '\n\n' + JSON.stringify(reports, null, 2);
    document.title = 'FAIL — IRONTRAIL audio validation';
  }
})();
</script>
</html>
