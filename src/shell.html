  <div id="hudCombo" class="hud-block hud-combo" hidden><div class="combo-top"><strong id="hudComboValue">×1</strong><span>☠</span></div><div class="combo-track"><div id="hudComboFill" class="bar-fill"></div></div></div>
  <div id="fuelHud" class="hud-block hud-fuel"><div class="fuel-top"><span>⛽</span><strong id="fuelValue">100%</strong></div><div id="fuelMeter" class="fuel-track" role="meter" aria-label="Fuel remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="fuelFill" class="bar-fill"></div></div><div class="fuel-bottom"><span>☠</span><strong id="zombieValue">0 / 5</strong></div></div>

</div>
